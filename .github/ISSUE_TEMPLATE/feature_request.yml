name: Feature request
description: Suggest an improvement to Lantern.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or limitation you are running into.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional workarounds, references, or sketches.
