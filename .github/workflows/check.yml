name: Check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ORT_CACHE_DIR: ${{ github.workspace }}/.cache/ort

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  tools:
    name: Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-desktop
        if: runner.os != 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: tools
          cache-directories: .cache/ort
      - name: Check
        run: cargo check --workspace ${{ runner.os == 'Linux' && '--exclude lantern-ui' || '' }} --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace ${{ runner.os == 'Linux' && '--exclude lantern-ui' || '' }} --all-targets --locked
      - name: Test
        run: cargo test --workspace ${{ runner.os == 'Linux' && '--exclude lantern-ui' || '' }} --locked
      - name: Check packaging
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build desktop
        if: runner.os != 'Linux'
        run: cargo build --locked -p lantern-ui
      - name: Smoke test desktop
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/smoke-desktop.py target/debug/lantern-ui${{ runner.os == 'Windows' && '.exe' || '' }}

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 gtksourceview5 glib2-devel openssl pkgconf python
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-arch
          cache-directories: .cache/ort
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Check packaging
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

